name: Build OS image

on:
  push:
    branches: [master]
    paths:
      - "images/Containerfile_os"
      - ".github/workflows/build-os.yml"
  pull_request:
    paths:
      - "images/Containerfile_os"
      - ".github/workflows/build-os.yml"
  schedule:
    # Daily, so the image picks up upstream Kinoite and package updates.
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kinoite-nvidia
  CONTAINERFILE: images/Containerfile_os

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The Kinoite base plus an akmod build does not fit on a stock runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Compute image name and tags
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Rootful podman, same as rebuild_os.sh.
      - name: Build
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DATE: ${{ steps.meta.outputs.date }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          sudo podman build \
            --pull=newer \
            --file "$CONTAINERFILE" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${DATE}" \
            --tag "${IMAGE}:${SHA}" \
            "$(dirname "$CONTAINERFILE")"

      # Only master publishes; PRs and manual runs on other branches just build.
      - name: Push
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DATE: ${{ steps.meta.outputs.date }}
          SHA: ${{ steps.meta.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" \
            | sudo podman login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          for tag in latest "$DATE" "$SHA"; do
            sudo podman push "${IMAGE}:${tag}"
          done
