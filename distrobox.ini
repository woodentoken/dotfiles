# Dev environment. Create with: distrobox assemble create --file distrobox.ini
# Enter with:                  distrobox enter dev
#
# Uses a Fedora toolbox image matching the host release, so the Neovim version
# matches the host and anything compiled here (cargo tools, treesitter parsers)
# also runs on the host via the shared home directory.
# Keep the tag in sync with image/Containerfile.

[dev]
image=registry.fedoraproject.org/fedora-toolbox:44
pull=true

# Same shell & everyday tools as the host, so your .zshrc works in here
additional_packages="zsh stow fastfetch direnv neovim tmux git git-lfs bat fd-find ripgrep tree"

# Build toolchain
additional_packages="gcc gcc-c++ make cmake perl pkgconf-pkg-config openssl-devel ncurses-devel"

# Python
additional_packages="uv python3-devel python3-pip pipx"

# R, plus system libraries commonly needed to build R packages (httpgd, etc.)
additional_packages="R R-devel libcurl-devel libxml2-devel cairo-devel fontconfig-devel freetype-devel libpng-devel libtiff-devel harfbuzz-devel fribidi-devel"

# Documents & images
additional_packages="pandoc ImageMagick ImageMagick-devel feh"
